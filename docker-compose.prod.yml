services:
  app:
    build:
      context: .
      target: prod
    container_name: barbearia_app_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SERVER_NAME: barbearia-oliveira-alves.matheushrm.dev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    stop_grace_period: 30s

volumes:
  app_storage:
  caddy_data:
  caddy_config:
